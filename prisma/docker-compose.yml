version: "3.8"

services:
    db:
        container_name: prisma-calandy
        image: postgres
        restart: always
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=mysecretpassword
        ports:
            - "5555:5432"
        volumes:
            - db-data:/var/lib/postgresql/data

volumes:
    db-data:
